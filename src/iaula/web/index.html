<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IAula Virtual</title>
  <meta name="theme-color" content="#0078d7" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/motion.css" />
  <link rel="stylesheet" href="styles/views.css" />
</head>
<body>
  <div id="fx-bokeh" class="fx" aria-hidden="true"></div>
  <div id="fx-bubbles" class="fx" aria-hidden="true"></div>
  <div id="fx-orbs" class="fx" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
  </div>
  <div class="lens-flare" aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="fish-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffb53e" />
        <stop offset="55%" stop-color="#f77f1e" />
        <stop offset="100%" stop-color="#d84a1e" />
      </linearGradient>
    </defs>
  </svg>

  <svg class="fish" viewBox="0 0 96 60" width="88" height="55" style="top:16%; --dur:52s; --delay:-14s; --op:.8" aria-hidden="true">
    <path class="fish-tail" style="transform-box:fill-box" d="M22 30 L4 14 Q10 30 4 46 Z" fill="url(#fish-grad)" opacity="0.9" />
    <path d="M38 16 Q48 4 58 15 Q48 12 38 16 Z" fill="#d84a1e" opacity="0.85" />
    <ellipse cx="48" cy="30" rx="30" ry="16" fill="url(#fish-grad)" />
    <ellipse cx="46" cy="23" rx="22" ry="7" fill="#fff" opacity="0.35" />
    <path d="M44 16 Q40 30 44 44" stroke="#fff" stroke-width="3" opacity="0.45" fill="none" />
    <path d="M56 16 Q52 30 56 44" stroke="#fff" stroke-width="2.5" opacity="0.35" fill="none" />
    <path d="M44 42 Q48 52 56 46 Q50 42 44 42 Z" fill="#d84a1e" opacity="0.8" />
    <circle cx="68" cy="26" r="4.5" fill="#fff" />
    <circle cx="69" cy="26" r="2.4" fill="#123" />
    <circle cx="70" cy="25" r="0.9" fill="#fff" />
  </svg>

  <svg class="fish" viewBox="0 0 96 60" width="56" height="35" style="top:46%; --dur:70s; --delay:-38s; --op:.45" aria-hidden="true">
    <path class="fish-tail" style="transform-box:fill-box" d="M22 30 L4 14 Q10 30 4 46 Z" fill="url(#fish-grad)" opacity="0.9" />
    <path d="M38 16 Q48 4 58 15 Q48 12 38 16 Z" fill="#d84a1e" opacity="0.85" />
    <ellipse cx="48" cy="30" rx="30" ry="16" fill="url(#fish-grad)" />
    <ellipse cx="46" cy="23" rx="22" ry="7" fill="#fff" opacity="0.35" />
    <path d="M44 16 Q40 30 44 44" stroke="#fff" stroke-width="3" opacity="0.45" fill="none" />
    <path d="M44 42 Q48 52 56 46 Q50 42 44 42 Z" fill="#d84a1e" opacity="0.8" />
    <circle cx="68" cy="26" r="4.5" fill="#fff" />
    <circle cx="69" cy="26" r="2.4" fill="#123" />
    <circle cx="70" cy="25" r="0.9" fill="#fff" />
  </svg>

  <div id="fx-grass" aria-hidden="true"></div>

  <header class="header glass">
    <div class="header-inner">
      <a class="brand" href="#resumen" aria-label="IAula Virtual">
        <svg class="brand-logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="17" cy="21" r="12" fill="rgba(255,255,255,0.28)" stroke="#fff" stroke-width="1.6" />
          <circle cx="12.5" cy="16.5" r="3.4" fill="#fff" opacity="0.9" />
          <circle cx="29" cy="13" r="6" fill="rgba(255,255,255,0.22)" stroke="#fff" stroke-width="1.3" />
          <circle cx="27" cy="11" r="1.6" fill="#fff" opacity="0.9" />
          <circle cx="30" cy="29" r="4" fill="rgba(255,255,255,0.22)" stroke="#fff" stroke-width="1.2" />
        </svg>
        <span class="brand-word">IAula <span class="word-accent">Virtual</span></span>
      </a>
      <div class="header-side">
        <span class="status status--onpanel" id="st-portal" title="Sesión del aula"><span class="status-dot"></span><span class="st-txt">aula…</span></span>
        <span class="status status--onpanel" id="st-nlm" title="Sesión NotebookLM"><span class="status-dot"></span><span class="st-txt">NLM…</span></span>
        <button class="glossy-btn" id="btn-check">Revisar ahora</button>
      </div>
    </div>
  </header>

  <main class="container page" id="view" aria-live="polite"></main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="start-menu" id="start-menu" role="menu" aria-label="Menú de inicio">
    <div class="sm-head">IAula Virtual</div>
    <button class="sm-item" data-route="resumen" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      Resumen
    </button>
    <button class="sm-item" data-route="cursos" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Cursos
    </button>
    <button class="sm-item" data-route="tareas" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Tareas
    </button>
    <button class="sm-item" data-route="notebooklm" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h12"/></svg>
      NotebookLM
    </button>
    <button class="sm-item" data-route="asistente" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 9 9 0 0 1-3.8-.8L4 20l1.1-4.2A8.4 8.4 0 0 1 12.5 3a8.4 8.4 0 0 1 8.5 8.5z"/></svg>
      Asistente
    </button>
    <div class="sm-sep"></div>
    <button class="sm-item" id="sm-check" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      Revisar ahora
    </button>
    <a class="sm-item js-portal" href="https://aulavirtualmoodle.uleam.edu.ec/my/" target="_blank" rel="noopener" role="menuitem">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/></svg>
      Abrir aula virtual
    </a>
  </div>

  <nav class="taskbar" aria-label="Barra de tareas">
    <button class="start-orb" id="start-orb" aria-label="Menú de inicio" title="Inicio">
      <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 6.4 C5.6 4.1 8.7 4.0 11.3 5.5 L11.3 11.5 C8.7 10.0 5.6 10.1 2.5 12.3 Z" fill="#e5484d" />
        <path d="M12.7 5.8 C15.3 7.3 18.4 7.2 21.5 5.0 L21.5 11.0 C18.4 13.2 15.3 13.3 12.7 11.8 Z" fill="#7fc242" />
        <path d="M2.5 13.5 C5.6 11.3 8.7 11.4 11.3 12.9 L11.3 18.9 C8.7 17.4 5.6 17.5 2.5 19.7 Z" fill="#43a8e8" />
        <path d="M12.7 13.2 C15.3 14.7 18.4 14.6 21.5 12.4 L21.5 18.4 C18.4 20.6 15.3 20.7 12.7 19.2 Z" fill="#f5bd3f" />
      </svg>
    </button>
    <a class="task-btn" href="#resumen" data-route="resumen" title="Resumen">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      <span class="task-label">Resumen</span>
    </a>
    <a class="task-btn" href="#cursos" data-route="cursos" title="Cursos">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="task-label">Cursos</span>
    </a>
    <a class="task-btn" href="#tareas" data-route="tareas" title="Tareas">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="task-label">Tareas</span>
    </a>
    <a class="task-btn" href="#notebooklm" data-route="notebooklm" title="NotebookLM">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h12"/></svg>
      <span class="task-label">NotebookLM</span>
    </a>
    <a class="task-btn" href="#asistente" data-route="asistente" title="Asistente">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 9 9 0 0 1-3.8-.8L4 20l1.1-4.2A8.4 8.4 0 0 1 12.5 3a8.4 8.4 0 0 1 8.5 8.5z"/></svg>
      <span class="task-label">Asistente</span>
    </a>
    <div class="task-tray">
      <span id="tray-info" class="tray-info"></span>
      <span class="tray-clock" id="clock"></span>
    </div>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
